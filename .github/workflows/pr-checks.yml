name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # PR size check
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          echo "Checking PR size..."
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)
          CHANGED_LINES=$(git diff --stat origin/main...HEAD | tail -1 | awk '{print $4+$6}')

          echo "Files changed: $CHANGED_FILES"
          echo "Lines changed: $CHANGED_LINES"

          if [ "$CHANGED_FILES" -gt 50 ]; then
            echo "⚠️  Warning: PR changes $CHANGED_FILES files (recommended: <50)"
          fi

          if [ "$CHANGED_LINES" -gt 1000 ]; then
            echo "⚠️  Warning: PR changes $CHANGED_LINES lines (recommended: <1000)"
          fi

  # File naming check
  file-naming:
    name: File Naming Convention Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Python file naming
        run: |
          echo "Checking Python file naming conventions..."
          git diff --name-only origin/main...HEAD | grep "\.py$" | while read file; do
            if [[ "$file" =~ [A-Z] ]]; then
              echo "❌ Invalid Python file name (should be snake_case): $file"
              exit 1
            fi
          done || echo "✅ All Python files follow snake_case convention"

      - name: Check TypeScript file naming
        run: |
          echo "Checking TypeScript file naming conventions..."
          git diff --name-only origin/main...HEAD | grep "\.tsx$" | while read file; do
            basename=$(basename "$file" .tsx)
            if [[ ! "$basename" =~ ^[A-Z] ]]; then
              echo "⚠️  Warning: React component should be PascalCase: $file"
            fi
          done || echo "✅ All React components follow PascalCase convention"

  # Test coverage change
  coverage-diff:
    name: Test Coverage Diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: react-ui
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: react-ui
        run: npm test -- --watchAll=false --coverage --coverageReporters=json-summary
        continue-on-error: true

      - name: Extract coverage percentage
        working-directory: react-ui
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | python3 -c "import sys, json; print(round(json.load(sys.stdin)['total']['lines']['pct'], 2))")
            echo "Test coverage: $COVERAGE%"
            echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          else
            echo "No coverage data found"
          fi

  # Breaking changes check
  breaking-changes:
    name: Breaking Changes Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for database schema changes
        run: |
          echo "Checking for database schema changes..."
          git diff origin/main...HEAD -- "src/coordinator/repositories/*.py" > schema_diff.txt
          if [ -s schema_diff.txt ]; then
            echo "⚠️  Database schema changes detected - ensure migration strategy is in place"
            cat schema_diff.txt
          else
            echo "✅ No database schema changes"
          fi

      - name: Check for API contract changes
        run: |
          echo "Checking for API contract changes..."
          git diff origin/main...HEAD -- "src/coordinator/schemas.py" > api_diff.txt
          if [ -s api_diff.txt ]; then
            echo "⚠️  API contract changes detected - ensure backward compatibility"
            cat api_diff.txt
          else
            echo "✅ No API contract changes"
          fi
