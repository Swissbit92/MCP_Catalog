name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Python backend tests
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        run: |
          echo "Running backend unit tests..."
          python tests/backend/coordinator/test_server.py || true
          python tests/backend/coordinator/test_tool_calling.py || true
          python tests/backend/coordinator/test_citation_validation.py || true
          python tests/backend/coordinator/test_synthesis_prompt.py || true
          python tests/backend/coordinator/test_summarization.py || true
          python tests/backend/coordinator/test_persona_schema.py || true
          python tests/backend/coordinator/test_persona_truncation.py || true
          python tests/backend/coordinator/test_repositories.py || true

      - name: Run integration tests (no server required)
        run: |
          echo "Running integration tests..."
          python tests/integration/test_intent_classification.py || true
          python tests/integration/test_phase3_simple.py || true

  # React frontend tests
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Debug - Check versions and package files
        working-directory: react-ui
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "TypeScript in package.json:"
          grep "typescript" package.json || echo "Not found"
          echo "Package-lock.json hash:"
          sha256sum package-lock.json || shasum -a 256 package-lock.json

      - name: Install frontend dependencies
        working-directory: react-ui
        run: npm ci --verbose

      - name: Run frontend tests
        working-directory: react-ui
        run: npm test -- --watchAll=false --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: react-ui/coverage/

  # React build verification
  frontend-build:
    name: Frontend Build (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Debug - Check versions and package files
        working-directory: react-ui
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "TypeScript in package.json:"
          grep "typescript" package.json || echo "Not found"
          echo "Package-lock.json hash:"
          sha256sum package-lock.json || shasum -a 256 package-lock.json

      - name: Install frontend dependencies
        working-directory: react-ui
        run: npm ci --verbose

      - name: Build frontend
        working-directory: react-ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: react-ui/build/

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m compileall src/ -q

      - name: Count Python files
        run: |
          echo "Python files in src/:"
          find src/ -name "*.py" | wc -l

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          grep -r "TODO" src/ || echo "No TODOs found"

  # Security checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit (frontend)
        working-directory: react-ui
        run: npm audit --audit-level=high || true

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r "api_key\|apikey\|password\|secret" src/ --include="*.py" || echo "No hardcoded secrets found"
